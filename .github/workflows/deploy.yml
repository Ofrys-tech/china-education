name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SITE_URL: https://${{ github.repository_owner }}.github.io
  PUBLIC_LEAD_ENDPOINT: ${{ vars.PUBLIC_LEAD_ENDPOINT }}
  PUBLIC_LEAD_PROVIDER: ${{ vars.PUBLIC_LEAD_PROVIDER }}
  PUBLIC_ANALYTICS_SRC: ${{ vars.PUBLIC_ANALYTICS_SRC }}
  PUBLIC_ANALYTICS_DOMAIN: ${{ vars.PUBLIC_ANALYTICS_DOMAIN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Fast checks
        run: npm run lint && npm run check && npm run test && npm run check:assets

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Resolve base path
        run: |
          BASE="${{ steps.pages.outputs.base_path }}"
          if [ -z "$BASE" ] || [ "$BASE" = "/" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=${BASE%/}/" >> "$GITHUB_ENV"
          fi
          echo "Building for ${SITE_URL}${BASE_PATH:-/}"

      - name: Build
        run: npm run build

      - name: Check built HTML
        run: npm run check:html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke live site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsSL "$PAGE_URL" | grep -q "ADLAS"; then
              echo "Live site OK: $PAGE_URL"
              exit 0
            fi
            echo "Waiting for Pages… ($attempt/12)"
            sleep 5
          done
          echo "Live site did not return expected content: $PAGE_URL"
          exit 1
